spec:
  pipelineRef:
    name: build-images-pipeline
  params:
    - name: repo-url
      value: 'https://github.ibm.com/Bhavna-Jain3/My-Tessia-Mesh-Repo.git'
    - name: repo-url2
      value: 'https://github.ibm.com/Bhavna-Jain3/temp-repo.git'
    - name: revision
      value: main
    - name: revision2
      value: main
    - name: subdirectory
      value: tessia-mesh
    - name: subdirectory2
      value: tessia-mesh-devops
    - name: image-url
      value: 'image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/rustimage'
    - name: environment
      value: development
  workspaces:
    - name: shared-data
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: shared-data2
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
